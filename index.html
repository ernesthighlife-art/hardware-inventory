<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b3028">
<title>我的庫存</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f1ea;--surface:#fffdf9;--text:#2b241e;--muted:#81766b;--line:#e5dbcf;--accent:#c7782a;--accentBg:#fff1df;--success:#277354;--successBg:#e9f6ef;--warn:#a56817;--warnBg:#fff5df;--danger:#ad3d32;--dangerBg:#fff0ed;--shadow:0 8px 28px rgba(78,58,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#f5f1ea,#eaddcc)}
.login-card{width:min(94%,440px);background:var(--surface);border-radius:24px;box-shadow:0 20px 70px rgba(78,58,42,.16);padding:28px}
.login-logo{font-size:44px}.login-title{font-size:28px;font-weight:900}.login-sub{color:var(--muted);margin:4px 0 17px}
label{display:block;font-size:13px;font-weight:850;margin:13px 0 6px}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1px solid #ddd2c6;border-radius:11px;background:#fff;outline:none}
.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:10px 14px;font-weight:800}.secondary{border:1px solid var(--line);background:#fff;color:#4d433c;border-radius:11px;padding:9px 12px;font-weight:750}
.error{background:var(--dangerBg);color:var(--danger);border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.55;margin-top:10px}.success{background:var(--successBg);color:var(--success);border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.55;margin-top:10px}.loading{background:var(--blueBg);color:#34527e;border-radius:11px;padding:10px 12px;font-size:13px;line-height:1.55;margin-top:10px}
header{background:linear-gradient(135deg,#352a23,#5a4638);color:#fff;padding:17px 18px 20px;position:sticky;top:0;z-index:10}.header-inner{max-width:1200px;margin:auto}.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
.title{font-size:23px;font-weight:850}.subtitle{font-size:12px;color:#eaded3;margin-top:3px}.account{font-size:12px;color:#eaded3;margin-top:5px}.search{width:100%;margin-top:13px;border:0;border-radius:15px;padding:13px 15px;background:#fff;color:#111;outline:none;box-shadow:0 5px 18px rgba(66,48,35,.12)}
main{max-width:1200px;margin:auto;padding:15px 16px 110px}.quick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}.quick button{border:1px solid var(--line);background:var(--surface);border-radius:13px;padding:10px 7px;color:#574b42;font-weight:750}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:13px}.card{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border:1px solid rgba(231,221,209,.75)}.stat{padding:14px}.stat .label{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;margin:3px 0}.stat small{color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;margin-bottom:12px}.tabs button{border:0;border-radius:12px;background:#fff;padding:10px 5px;font-weight:800;color:#6e6258}.tabs button.active{background:var(--accent);color:#fff}
.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;color:#62564d;font-size:13px}
.addbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.hint{font-size:13px;color:var(--muted)}.list{display:grid;gap:10px}
.product{padding:14px}.product-top{display:flex;gap:12px;align-items:flex-start}.thumb{width:68px;height:68px;flex:none;border-radius:13px;background:#f2ece4;display:flex;align-items:center;justify-content:center;overflow:hidden;color:#a89a8c;font-size:25px}.thumb img{width:100%;height:100%;object-fit:cover}
.info{min-width:0;flex:1}.name{font-weight:850;font-size:16px;line-height:1.35}.sku{font-size:12px;color:var(--muted);margin-top:2px}.meta{font-size:13px;color:#6b5f55;line-height:1.62;margin-top:6px}.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#f3eee8;color:#5f554c}.badge.ok{background:var(--successBg);color:var(--success)}.badge.low{background:var(--warnBg);color:var(--warn)}.badge.out{background:var(--dangerBg);color:var(--danger)}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.actions button{border:1px solid var(--line);background:#fbf8f3;border-radius:10px;padding:8px 10px;font-size:13px}.danger{background:var(--dangerBg)!important;color:var(--danger)!important;border-color:#ffd4cf!important}
.section{padding:16px;margin-bottom:12px}.section h3{margin:0 0 10px}.rows{display:grid}.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:850px}.table th,.table td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}.table th{background:#fbf7f1;color:#695d53}.table td.num{text-align:right}
.empty{text-align:center;color:var(--muted);padding:45px 12px}.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px}.notice{background:var(--accentBg);color:#7a4a19;border-radius:13px;padding:11px 13px;font-size:13px;line-height:1.55;margin-bottom:12px}
.dialog{border:0;border-radius:20px;width:min(95%,720px);padding:0;box-shadow:0 20px 70px rgba(0,0,0,.25)}.dialog::backdrop{background:rgba(15,23,42,.66)}.form{padding:20px}.form h2{margin:0 0 8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form-actions{display:flex;gap:8px;margin-top:18px}.form-actions>*{flex:1}.preview{width:100%;max-height:210px;object-fit:contain;border-radius:13px;margin-top:8px;background:#f1ece5}
.fab{position:fixed;right:18px;bottom:18px;width:58px;height:58px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:30px;box-shadow:0 8px 30px rgba(15,23,42,.28);z-index:12}
.scan-box{border:2px dashed #d5c6b5;padding:26px;border-radius:16px;text-align:center;background:#fcfaf6}
@media(max-width:900px){.quick{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr 1fr}.tabs{grid-template-columns:repeat(4,1fr)}}@media(max-width:560px){main{padding:12px}.two{grid-template-columns:1fr}.topline .secondary{display:none}}
@media(min-width:950px){.product{display:grid;grid-template-columns:68px 1fr auto;gap:12px;align-items:center}.product-top{display:contents}.product .actions{margin-top:0;justify-content:flex-end}}

.filter-panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.filter-grid label{margin:0;font-size:12px;color:var(--muted)}
.filter-grid select,.filter-grid input{margin-top:4px}
.filter-actions{display:flex;gap:8px;align-items:center;margin-top:9px}
.filter-summary{font-size:12px;color:var(--muted);flex:1}
@media(max-width:900px){.filter-grid{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.filter-grid{grid-template-columns:1fr}.filter-actions{flex-wrap:wrap}.filter-summary{flex-basis:100%}}

.search-wrap{position:relative;margin-top:13px}
.search-wrap .search{margin-top:0;padding-right:98px}
.voice-btn{position:absolute;right:6px;top:6px;width:38px;height:38px;border:0;border-radius:11px;background:#f3ece4;color:#5e4f45;font-size:19px}
.voice-btn.listening{background:#c7782a;color:#fff;box-shadow:0 0 0 4px rgba(199,120,42,.16)}
.smart-btn{position:absolute;right:51px;top:6px;width:38px;height:38px;border:0;border-radius:11px;background:#efe7ff;color:#5b3f91;font-size:18px}.smart-btn.busy{background:#5b3f91;color:#fff}.smart-summary{font-size:12px;color:#5b3f91;background:#f5efff;border-radius:10px;padding:8px 10px;margin-top:6px;line-height:1.5}
.search-tools{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 10px}
.search-tools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 10px;color:#62564d;font-size:12px}
.search-hint{font-size:12px;color:var(--muted);margin:5px 2px 10px}
.quick-search-box{display:flex;gap:8px;overflow:auto;margin-bottom:10px}
.quick-search-box button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 10px;font-size:12px;color:#62564d}
.voice-note{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}

.offline-tools{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:8px}
.network-pill{font-size:12px;padding:6px 9px;border-radius:999px;background:#ffffff16;color:#f6eee7;border:1px solid #ffffff22}
.network-pill.offline{background:#6d432f;color:#fff4e8}
.network-pill.pending{background:#7a4a19;color:#fff}
.offline-tools button{border:1px solid #ffffff33;background:#ffffff10;color:#fff;border-radius:10px;padding:6px 10px;font-size:12px;font-weight:750}
.offline-note{background:#f4eadf;color:#6e4b2f;border:1px solid #e7d5c2;border-radius:12px;padding:9px 11px;font-size:12px;line-height:1.55;margin-bottom:10px}
.sync-progress{font-size:12px;color:var(--muted);margin-top:6px}
</style>
</head>
<body>

<div id="loginScreen" class="login-screen">
  <div class="login-card">
    <div class="login-logo">📦</div>
    <div class="login-title">我的庫存</div>
    <div class="login-sub">五金商品庫存管理系統</div>
    <form id="loginForm">
      <label>登入 Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="請輸入 Email" required>
      <label>登入密碼</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="請輸入密碼" required>
      <button id="loginBtn" class="primary" style="width:100%;margin-top:17px" type="submit">登入庫存系統</button>
      <div id="loginMsg"></div>
    </form>
  </div>
</div>

<div id="appShell" class="hidden">
<header><div class="header-inner"><div class="topline">
  <div><div class="title">📦 我的庫存</div><div class="subtitle">商品・廠商・分類・位置・進出貨</div><div id="accountEmail" class="account"></div></div>
  <button id="logoutBtn" class="secondary" style="background:#ffffff14;color:#fff;border-color:#ffffff33">登出</button>
</div><div class="search-wrap">
      <input id="search" class="search" placeholder="🔎 搜尋商品編號、名稱、規格、廠商、分類、位置、條碼…">
      <button id="smartBtn" class="smart-btn" title="智慧搜尋" aria-label="智慧搜尋">🧠</button>
      <button id="voiceBtn" class="voice-btn" title="語音搜尋" aria-label="語音搜尋">🎤</button>
    </div>
    <div id="searchHint" class="search-hint">可以直接說：「白鐵 M6 螺絲」、「XX五金的螺絲」</div><div id="smartSummary" class="smart-summary hidden"></div><div class="offline-tools"><span id="networkStatus" class="network-pill">準備中…</span><span id="syncStatus" class="network-pill hidden"></span><button id="syncBtn" type="button">☁️ 同步</button><button id="downloadOfflineBtn" type="button">⬇️ 下載離線資料</button></div></div></header>
<main>
  <div id="offlineNote" class="offline-note hidden"></div>
  <div class="quick"><button onclick="setTab('products')">📦 商品</button><button onclick="setTab('vendors')">🏭 廠商</button><button onclick="setTab('categories')">📂 分類</button><button onclick="setTab('locations')">📍 位置</button><button onclick="setTab('documents')">📷 貨單</button></div>
  <div class="grid">
    <div class="card stat"><span class="label">商品種類</span><strong id="statProducts">0</strong><small>雲端商品</small></div>
    <div class="card stat"><span class="label">庫存總數</span><strong id="statQty">0</strong><small>目前可見資料</small></div>
    <div class="card stat"><span class="label">廠商</span><strong id="statVendors">0</strong><small>合作廠商</small></div>
    <div class="card stat"><span class="label">低庫存</span><strong id="statLow">0</strong><small>需要補貨</small></div>
  </div>
  <div class="tabs">
    <button class="active" data-tab="products">商品</button><button data-tab="vendors">廠商</button><button data-tab="categories">分類</button><button data-tab="locations">位置</button><button data-tab="transactions">異動</button><button data-tab="documents">貨單／AI</button>
  </div>
  <div id="app"><div class="card empty">載入中…</div></div>
</main><button class="fab" id="addBtn">＋</button>
</div>

<dialog id="productDialog" class="dialog"><div class="form">
<h2 id="productDialogTitle">新增商品</h2><div class="notice">商品資料會儲存在雲端。照片會放在私有的 inventory-photos。已建立商品請使用「入庫／出庫」調整庫存。</div>
<div class="two"><div><label>商品名稱</label><input id="name" type="text" placeholder="例如：十字螺絲"></div><div><label>商品編號</label><input id="sku" type="text" placeholder="例如：SL-M6-030-001"></div></div>
<div class="two"><div><label>規格</label><input id="spec" type="text" placeholder="例如：M6 × 30mm、白鐵"></div><div><label>條碼</label><input id="barcode" type="text" placeholder="可手動輸入"></div></div>
<div class="two"><div><label>廠商</label><select id="vendor"></select></div><div><label>單位名稱</label><input id="unit" type="text" placeholder="例如：個、盒、包、箱"></div></div>
<div class="two"><div><label>母項目</label><input id="parentCategory" type="text" placeholder="例如：螺絲類"></div><div><label>子項目</label><input id="childCategory" type="text" placeholder="例如：十字螺絲"></div></div>
<div class="two"><div><label>所在位置</label><input id="location" type="text" placeholder="例如：A01-03"></div><div><label>日期</label><input id="date" type="date"></div></div>
<div class="two"><div><label>目前數量</label><input id="qty" type="number" min="0" value="0"></div><div><label>最低庫存</label><input id="minQty" type="number" min="0" value="0"></div></div>
<div class="two"><div><label>進貨成本</label><input id="cost" type="number" min="0" step="0.01" placeholder="0"></div><div><label>售價</label><input id="price" type="number" min="0" step="0.01" placeholder="0"></div></div>
<label>備註／搜尋關鍵字</label><textarea id="note" placeholder="例如：黑色、常用、客人常叫黑螺絲"></textarea>
<label>商品照片</label><input id="photo" type="file" accept="image/*" capture="environment"><img id="preview" class="preview" style="display:none">
<div class="form-actions"><button class="secondary" id="cancelProduct">取消</button><button class="primary" id="saveProduct">儲存商品</button></div>
</div></dialog>

<dialog id="vendorDialog" class="dialog"><div class="form"><h2>新增廠商</h2>
<label>廠商名稱</label><input id="vendorName" type="text" placeholder="例如：XX五金"><label>聯絡電話</label><input id="vendorPhone" type="text" placeholder="選填"><label>地址</label><input id="vendorAddress" type="text" placeholder="選填"><label>聯絡人</label><input id="vendorContact" type="text" placeholder="選填"><label>備註</label><textarea id="vendorNote" placeholder="選填"></textarea>
<div class="form-actions"><button class="secondary" id="cancelVendor">取消</button><button class="primary" id="saveVendor">新增廠商</button></div></div></dialog>

<dialog id="movementDialog" class="dialog"><div class="form"><h2 id="movementTitle">庫存異動</h2><div id="movementProduct" class="notice"></div><div class="small" style="margin-top:6px">這次操作會同時更新庫存並建立異動紀錄。</div><label>數量</label><input id="movementQty" type="number" min="1" value="1"><label>原因</label><input id="movementReason" type="text" placeholder="例如：進貨、銷售、損耗、調整"><div class="form-actions"><button class="secondary" id="cancelMovement">取消</button><button class="primary" id="saveMovement">確認</button></div></div></dialog>

<dialog id="documentDialog" class="dialog"><div class="form"><h2>📷 貨單／AI 整理</h2><div class="scan-box"><div style="font-size:38px">📷</div><h3>拍攝或選擇貨單</h3><div class="small">照片會先儲存在私有空間。真正 AI 辨識會在後端完成。</div><input id="documentPhoto" type="file" accept="image/*" capture="environment" style="margin-top:14px"></div><div id="docPreview"></div><div class="form-actions"><button class="secondary" id="cancelDocument">關閉</button><button class="primary" id="createDocument">建立待辨識貨單</button></div></div></dialog>

<script>
const CONFIG={
  url:"https://mmmimwkgcsbgsbuiwnrs.supabase.co",
  key:"sb_publishable_7OoeJaMuSuNdZsP3KHpEEw_n8mpVdpf",
  bucket:"inventory-photos",
  smartSearchFunction:"smart-search"
};

let sb=null, session=null, currentTab="products", editingId=null, pendingPhoto=null, movementId=null, movementType="入庫";
let page=0, PAGE_SIZE=40, totalCount=0, productCache=[], vendorCache=[], categoryCache=[], locationCache=[];
let searchMode="normal", smartQuery="", smartFilters=null;
const today=new Date().toISOString().slice(0,10);
const $=id=>document.getElementById(id);
const fmt=n=>Number(n||0).toLocaleString("zh-TW");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function setLoginMessage(text,type="error"){$("loginMsg").innerHTML=text?`<div class="${type}">${esc(text)}</div>`:""}
function setAppMessage(text,type="error"){$("app").innerHTML=`<div class="${type==="error"?"card empty":""}">${esc(text)}</div>`}
function showLogin(){ $("loginScreen").classList.remove("hidden");$("appShell").classList.add("hidden") }
function showApp(){ $("loginScreen").classList.add("hidden");$("appShell").classList.remove("hidden");$("accountEmail").textContent=session?.user?.email?`登入：${session.user.email}`:"" }

async function boot(){
  try{
    if(!window.supabase)throw new Error("Supabase 元件載入失敗，請檢查網路連線。");
    sb=window.supabase.createClient(CONFIG.url,CONFIG.key);
    const {data,error}=await sb.auth.getSession();
    if(error)throw error;
    session=data.session||null;
    if(session){showApp();renderSearchTools();initSmartSearch();initVoiceSearch();await render(true)}else showLogin();
    sb.auth.onAuthStateChange(async(_event,newSession)=>{
      session=newSession||null;
      if(session){showApp();await render(true)}else showLogin();
    });
  }catch(e){
    showLogin();setLoginMessage("系統初始化失敗："+(e.message||String(e)));
  }
}

$("loginForm").onsubmit=async e=>{
  e.preventDefault();setLoginMessage("正在登入並連線雲端資料庫…","loading");$("loginBtn").disabled=true;
  try{
    const {data,error}=await sb.auth.signInWithPassword({email:$("loginEmail").value.trim(),password:$("loginPassword").value});
    if(error)throw error;
    session=data.session;showApp();renderSearchTools();initSmartSearch();initVoiceSearch();await render(true);
  }catch(e){setLoginMessage("登入失敗："+(e.message||"請檢查 Email 與密碼。"))}
  finally{$("loginBtn").disabled=false}
};
$("logoutBtn").onclick=async()=>{if(sb&&navigator.onLine)await sb.auth.signOut();session=null;clearOfflineUser();showLogin()};

async function loadMeta(){
  const [v,c,l]=await Promise.all([
    sb.from("vendors").select("id,name,phone,address,contact_name,note").order("name").limit(1000),
    sb.from("categories").select("id,name,parent_id,sort_order").order("sort_order").order("name").limit(1000),
    sb.from("locations").select("id,name,parent_id,sort_order").order("sort_order").order("name").limit(1000)
  ]);
  if(v.error)throw new Error("讀取廠商資料失敗："+v.error.message);
  if(c.error)throw new Error("讀取分類資料失敗："+c.error.message);
  if(l.error)throw new Error("讀取位置資料失敗："+l.error.message);
  vendorCache=v.data||[];categoryCache=c.data||[];locationCache=l.data||[];
}
async function loadStats(){
  const pc=await sb.from("products").select("id",{count:"exact",head:true});
  if(pc.error)throw new Error("讀取商品資料失敗："+pc.error.message);
  const vc=await sb.from("vendors").select("id",{count:"exact",head:true});
  if(vc.error)throw new Error("讀取廠商資料失敗："+vc.error.message);
  const low=await sb.from("products").select("id,stock,min_stock").limit(1000);
  if(low.error)throw new Error("讀取庫存統計失敗："+low.error.message);
  const qty=(low.data||[]).reduce((a,p)=>a+Number(p.stock||0),0);
  const lowCount=(low.data||[]).filter(p=>Number(p.stock||0)<=Number(p.min_stock||0)).length;
  $("statProducts").textContent=fmt(pc.count||0);$("statVendors").textContent=fmt(vc.count||0);
  $("statQty").textContent=fmt(qty)+(low.data?.length===1000?" +":"");$("statLow").textContent=fmt(lowCount)+(low.data?.length===1000?" +":"");
}
async function signedPhoto(path){
  if(!path)return "";
  const {data,error}=await sb.storage.from(CONFIG.bucket).createSignedUrl(path,3600);
  return error?"":(data?.signedUrl||"");
}


const productFilters={vendor:"",stock:"",parent:"",child:""};

function filterPanelHTML(){
  return `<div class="filter-panel">
    <div class="filter-grid">
      <label>廠商<select id="filterVendor"><option value="">全部廠商</option>${vendorCache.map(v=>`<option value="${esc(v.id)}">${esc(v.name)}</option>`).join("")}</select></label>
      <label>庫存狀態<select id="filterStock"><option value="">全部</option><option value="out">缺貨</option><option value="low">低庫存</option><option value="normal">庫存正常</option></select></label>
      <label>母項目<input id="filterParent" type="text" placeholder="例如：螺絲類"></label>

    </div>

function syncFilterUI(){
  if($("filterVendor"))$("filterVendor").value=productFilters.vendor;
  if($("filterStock"))$("filterStock").value=productFilters.stock;
  if($("filterParent"))$("filterParent").value=productFilters.parent;
  if($("filterChild"))$("filterChild").value=productFilters.child;
  const a=[];
  if(productFilters.vendor)a.push("廠商");
  if(productFilters.stock)a.push("庫存");
  if(productFilters.parent)a.push("母項目");
  if(productFilters.child)a.push("子項目");
  if($("filterSummary"))$("filterSummary").textContent=a.length?`已套用：${a.join("＋")}`:"可搭配上方搜尋使用";
}
function applyProductFilters(){
  productFilters.vendor=$("filterVendor")?.value||"";
  productFilters.stock=$("filterStock")?.value||"";
  productFilters.parent=$("filterParent")?.value.trim()||"";
  productFilters.child=$("filterChild")?.value.trim()||"";
  page=0;loadProducts();
}
function clearProductFilters(){
  productFilters.vendor="";productFilters.stock="";productFilters.parent="";productFilters.child="";
  page=0;loadProducts();
}
function setQuickStockFilter(type){productFilters.stock=type;page=0;loadProducts();}

async function loadProducts(){
  if(searchMode==="smart" && smartQuery){
    return runSmartSearch(smartQuery,{keepMode:true});
  }
  const q=$("search").value.trim();
  let query=sb.from("products").select(
    "id,sku,name,spec,category,location,stock,min_stock,cost,price,photo_url,created_at,updated_at,user_id,vendor_id,category_id,location_id,barcode,unit,record_date,photo_path,note,parent_category,child_category",
    {count:"exact"}
  );
  if(q){
    const safe=q.replace(/[(),]/g," ");
    query=query.or(`sku.ilike.%${safe}%,name.ilike.%${safe}%,spec.ilike.%${safe}%,category.ilike.%${safe}%,location.ilike.%${safe}%,barcode.ilike.%${safe}%,parent_category.ilike.%${safe}%,child_category.ilike.%${safe}%,note.ilike.%${safe}%`);
  }
  if(productFilters.vendor)query=query.eq("vendor_id",productFilters.vendor);
  if(productFilters.parent)query=query.ilike("parent_category",`%${productFilters.parent}%`);
  if(productFilters.child)query=query.ilike("child_category",`%${productFilters.child}%`);
  if(productFilters.stock==="out")query=query.eq("stock",0);
  if(productFilters.stock==="normal")query=query.gt("stock",0);

  const from=page*PAGE_SIZE,to=from+PAGE_SIZE-1;
  const {data,error,count}=await query.order("name").range(from,to);
  if(error)throw new Error("讀取商品清單失敗："+error.message);
  totalCount=count||0;productCache=data||[];
  const rows=await Promise.all(productCache.map(async p=>({...p,_photo:await signedPhoto(p.photo_path)})));
  renderProducts(rows);
}

async function runSmartSearch(q,options={}){
  q=String(q||"").trim();
  if(!q)return;
  const keepMode=!!options.keepMode;
  const btn=$("smartBtn");
  if(!keepMode){searchMode="smart";smartQuery=q;page=0;}
  else if(!smartQuery)smartQuery=q;
  if(btn){btn.disabled=true;btn.classList.add("busy");btn.textContent="…";}
  if($("smartSummary")){ $("smartSummary").classList.remove("hidden"); $("smartSummary").textContent="🧠 正在理解搜尋內容…"; }
  try{
    const {data,error}=await sb.functions.invoke(CONFIG.smartSearchFunction,{body:{query:q,page,page_size:PAGE_SIZE}});
    if(error)throw error;
    if(!data?.ok)throw new Error(data?.error||"智慧搜尋失敗");
    totalCount=Number(data.count||0);productCache=data.data||[];smartFilters=data.filters||null;
    const rows=await Promise.all(productCache.map(async p=>({...p,_photo:await signedPhoto(p.photo_path)})));
    renderProducts(rows);
    const f=data.filters||{};const parts=[];
    if(f.vendor)parts.push(`廠商：${f.vendor}`);
    if(Array.isArray(f.name_keywords)&&f.name_keywords.length)parts.push(`商品：${f.name_keywords.join("、")}`);
    if(Array.isArray(f.spec_keywords)&&f.spec_keywords.length)parts.push(`規格：${f.spec_keywords.join("、")}`);
    if(Array.isArray(f.keywords)&&f.keywords.length)parts.push(`關鍵字：${f.keywords.join("、")}`);
    if(Array.isArray(f.location_keywords)&&f.location_keywords.length)parts.push(`位置：${f.location_keywords.join("、")}`);
    if($("smartSummary"))$("smartSummary").textContent=parts.length?`🧠 智慧搜尋：${parts.join("｜")}`:`🧠 智慧搜尋：${q}`;
  }catch(e){
    console.error(e);
    searchMode="normal";smartQuery="";smartFilters=null;
    if($("smartSummary"))$("smartSummary").textContent="智慧搜尋目前無法連線，已改用一般搜尋。";
    const safe=q.replace(/[(),]/g," ");
    $("search").value=q;
    let query=sb.from("products").select("id,sku,name,spec,category,location,stock,min_stock,cost,price,photo_url,created_at,updated_at,user_id,vendor_id,category_id,location_id,barcode,unit,record_date,photo_path,note,parent_category,child_category",{count:"exact"});
    query=query.or(`sku.ilike.%${safe}%,name.ilike.%${safe}%,spec.ilike.%${safe}%,category.ilike.%${safe}%,location.ilike.%${safe}%,barcode.ilike.%${safe}%,parent_category.ilike.%${safe}%,child_category.ilike.%${safe}%,note.ilike.%${safe}%`);
    const from=page*PAGE_SIZE,to=from+PAGE_SIZE-1;
    const r=await query.order("name").range(from,to);
    if(r.error)throw new Error(r.error.message);
    totalCount=r.count||0;productCache=r.data||[];
    const rows=await Promise.all(productCache.map(async p=>({...p,_photo:await signedPhoto(p.photo_path)})));
    renderProducts(rows);
    if($("smartSummary"))$("smartSummary").textContent="⚪ 一般搜尋結果："+q;
  }finally{
    if(btn){btn.disabled=false;btn.classList.remove("busy");btn.textContent="🧠";}
  }
}
function renderProducts(ps){
  $("app").innerHTML=`
    <div class="toolbar"><button class="chip" onclick="setQuickStockFilter('low')">⚠️ 低庫存</button><button class="chip" onclick="setQuickStockFilter('out')">❌ 缺貨</button><button class="chip" onclick="filterProducts('photo')">📷 有照片</button><button class="chip" onclick="clearSearch()">清除搜尋</button>${searchMode==="smart"&&smartQuery?`<button class="chip" onclick="clearSmartSearch()">🧠 清除智慧搜尋</button>`:""}</div>
    ${filterPanelHTML()}
    <div class="addbar"><div class="hint">最相關結果／第 ${fmt(totalCount?page*PAGE_SIZE+1:0)}～${fmt(Math.min((page+1)*PAGE_SIZE,totalCount))} 筆，共 ${fmt(totalCount)} 筆</div><button class="primary" onclick="openProduct()">＋ 新增商品</button></div>
    <div class="list">${ps.length?ps.map(p=>{const st=Number(p.stock||0)===0?["缺貨","out"]:Number(p.stock||0)<=Number(p.min_stock||0)?["低庫存","low"]:["庫存正常","ok"];return `<div class="card product">
      <div class="product-top"><div class="thumb">${p._photo?`<img src="${p._photo}">`:"📦"}</div><div class="info"><div class="name">${esc(p.name||"未命名商品")}</div>
      ${p.sku?`<div class="sku">編號：${esc(p.sku)}</div>`:""}<div class="meta">${p.spec?`規格：${esc(p.spec)}<br>`:""}🏭 ${esc(vendorName(p.vendor_id))}${p.location?`　📍 ${esc(p.location)}`:""}<br>
      ${p.parent_category?`📂 ${esc(p.parent_category)}`:""}${p.child_category?`　└ ${esc(p.child_category)}`:""}${p.record_date?`<br>📅 ${esc(p.record_date)}`:""}</div>
      <div class="badges"><span class="badge ${st[1]}">${st[0]}</span><span class="badge">庫存 ${fmt(p.stock)} ${esc(p.unit||"個")}</span>${p.min_stock?`<span class="badge">最低 ${fmt(p.min_stock)}</span>`:""}</div></div></div>
      <div class="actions"><button onclick="openMovement('${p.id}','入庫')">📥 入庫</button><button onclick="openMovement('${p.id}','出庫')">📤 出庫</button><button onclick="openProduct('${p.id}')">✏️ 編輯</button><button onclick="showProductHistory('${p.id}')">📋 紀錄</button><button class="danger" onclick="removeProduct('${p.id}')">刪除</button></div>
    </div>`}).join(""):`<div class="card empty">目前沒有商品，或沒有符合搜尋條件的商品。</div>`}</div>
    <div class="pager"><button class="secondary" onclick="prevPage()" ${page===0?"disabled":""}>上一頁</button><span class="hint">第 ${page+1} / ${Math.max(1,Math.ceil(totalCount/PAGE_SIZE))} 頁</span><button class="secondary" onclick="nextPage()" ${(page+1)*PAGE_SIZE>=totalCount?"disabled":""}>下一頁</button></div>`;

  syncFilterUI();
}
function filterProducts(type){let ps=productCache;if(type==="low")ps=ps.filter(p=>Number(p.stock||0)<=Number(p.min_stock||0));if(type==="out")ps=ps.filter(p=>Number(p.stock||0)===0);if(type==="photo")ps=ps.filter(p=>!!p.photo_path);renderProducts(ps)}
function clearSmartSearch(){searchMode="normal";smartQuery="";smartFilters=null;if($("smartSummary")){$("smartSummary").classList.add("hidden");$("smartSummary").textContent="";}page=0;loadProducts()}
function clearSearch(){$("search").value="";clearSmartSearch();clearProductFilters()}
function prevPage(){if(page>0){page--;loadProducts()}}function nextPage(){if((page+1)*PAGE_SIZE<totalCount){page++;loadProducts()}}

function vendorName(id){return vendorCache.find(v=>v.id===id)?.name||"未設定廠商"}

const searchHistoryKey="inventory_recent_searches_v1";
let recognition=null;
let recentSearches=JSON.parse(localStorage.getItem(searchHistoryKey)||"[]");

function saveRecentSearch(q){
  q=q.trim();
  if(!q)return;
  recentSearches=[q,...recentSearches.filter(x=>x!==q)].slice(0,8);
  localStorage.setItem(searchHistoryKey,JSON.stringify(recentSearches));
}
function renderSearchTools(){
  const box=$("searchHint");
  if(!box)return;
  const recent=recentSearches.length
    ? `<div class="quick-search-box">${recentSearches.map(x=>`<button onclick="useRecentSearch('${esc(x).replace(/'/g,"&#039;")}')">${esc(x)}</button>`).join("")}</div>`
    : "";
  box.innerHTML=`${recent}<div class="voice-note">🎤 可以直接用手機鍵盤的麥克風輸入，也可以按右側麥克風由網站直接聽寫。</div>`;
}
function useRecentSearch(q){
  $("search").value=q;page=0;saveRecentSearch(q);loadProducts();
}
function initSmartSearch(){
  const Btn=$("smartBtn");
  if(!Btn)return;
  Btn.onclick=()=>{const q=$("search").value.trim();if(!q)return alert("請先輸入或說出想找的商品，例如：白鐵 M6 螺絲、XX五金的螺絲");saveRecentSearch(q);runSmartSearch(q)};
}

function initVoiceSearch(){
  const Btn=$("voiceBtn");
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!Btn)return;
  if(!SR){
    Btn.title="此瀏覽器不支援網站語音搜尋；可以使用手機鍵盤的麥克風";
    Btn.onclick=()=>alert("此瀏覽器不支援網站內建語音搜尋。請直接點搜尋框，再使用手機鍵盤上的麥克風。");
    return;
  }
  recognition=new SR();
  recognition.lang="zh-TW";
  recognition.interimResults=false;
  recognition.continuous=false;
  recognition.onstart=()=>{Btn.classList.add("listening");Btn.textContent="⏺";$("searchHint").textContent="正在聽，請直接說商品名稱或規格…"};
  recognition.onresult=e=>{
    const text=e.results?.[0]?.[0]?.transcript?.trim()||"";
    if(text){$("search").value=text;saveRecentSearch(text);page=0;runSmartSearch(text);}
  };
  recognition.onerror=e=>{
    Btn.classList.remove("listening");Btn.textContent="🎤";
    const msg=e.error==="not-allowed"?"瀏覽器沒有允許麥克風權限。":e.error==="no-speech"?"沒有聽到內容，請再試一次。":"語音搜尋失敗，請再試一次。";
    $("searchHint").textContent=msg;
    setTimeout(renderSearchTools,2200);
  };
  recognition.onend=()=>{Btn.classList.remove("listening");Btn.textContent="🎤";renderSearchTools()};
  Btn.onclick=()=>{
    try{
      if(Btn.classList.contains("listening")) recognition.stop();
      else recognition.start();
    }catch(e){}
  };
}


function updateSearchHint(){
  const q=$("search").value.trim();
  if(!q){renderSearchTools();return}
  let hint="正在搜尋商品…";
  if(/廠商|五金|有限公司|公司/.test(q))hint="正在用商品＋廠商關鍵字搜尋…";
  else if(/第.*層|貨架|位置|A\d|B\d|C\d/.test(q))hint="正在用位置＋商品關鍵字搜尋…";
  else if(/M\d|毫米|mm|公分|吋|英吋/.test(q))hint="正在用規格＋商品關鍵字搜尋…";
  $("searchHint").textContent=hint;
}

async function openProduct(id=null){
  await loadMeta();editingId=id;pendingPhoto=null;let p=null;
  if(id){const r=await sb.from("products").select("*").eq("id",id).single();if(r.error)return alert("讀取商品失敗："+r.error.message);p=r.data}
  $("productDialogTitle").textContent=p?"編輯商品":"新增商品";setStockFieldState(!!p);$("name").value=p?.name||"";$("sku").value=p?.sku||"";$("spec").value=p?.spec||"";$("barcode").value=p?.barcode||"";
  $("vendor").innerHTML=`<option value="">未設定廠商</option>`+vendorCache.map(v=>`<option value="${v.id}" ${p?.vendor_id===v.id?"selected":""}>${esc(v.name)}</option>`).join("");
  $("unit").value=p?.unit||"個";$("parentCategory").value=p?.parent_category||"";$("childCategory").value=p?.child_category||"";$("location").value=p?.location||"";$("date").value=p?.record_date||today;
  $("qty").value=p?.stock??0;setStockFieldState(!!p);$("minQty").value=p?.min_stock??0;$("cost").value=p?.cost??"";$("price").value=p?.price??"";$("note").value=p?.note||"";
  $("preview").style.display=p?.photo_path?"block":"none";$("preview").src=p?.photo_path?await signedPhoto(p.photo_path):"";$("photo").value="";$("productDialog").showModal();
}
async function uploadPhoto(file,productId){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=`${session.user.id}/products/${productId}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from(CONFIG.bucket).upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});if(error)throw error;return path;
}
$("photo").onchange=e=>{const f=e.target.files[0];if(!f)return;pendingPhoto=f;const r=new FileReader();r.onload=()=>{$("preview").src=r.result;$("preview").style.display="block"};r.readAsDataURL(f)};
$("saveProduct").onclick=async()=>{
  const user=await sb.auth.getUser();if(!user.data.user)return;
  const name=$("name").value.trim();if(!name)return alert("請輸入商品名稱");$("saveProduct").disabled=true;
  try{
    const obj={name,sku:$("sku").value.trim()||null,spec:$("spec").value.trim()||null,barcode:$("barcode").value.trim()||null,vendor_id:$("vendor").value||null,unit:$("unit").value.trim()||"個",parent_category:$("parentCategory").value.trim()||null,child_category:$("childCategory").value.trim()||null,location:$("location").value.trim()||null,record_date:$("date").value||today,min_stock:Math.max(0,Number($("minQty").value||0)),cost:Math.max(0,Number($("cost").value||0)),price:Math.max(0,Number($("price").value||0)),note:$("note").value.trim()||null,category:$("parentCategory").value.trim()||null};
    if(editingId){if(pendingPhoto)obj.photo_path=await uploadPhoto(pendingPhoto,editingId);const r=await sb.from("products").update({...obj,updated_at:new Date().toISOString()}).eq("id",editingId);if(r.error)throw r.error}
    else{
      const id=crypto.randomUUID();
      obj.id=id;
      obj.stock=Math.max(0,Number($("qty").value||0));
      if(pendingPhoto)obj.photo_path=await uploadPhoto(pendingPhoto,id);
      const r=await sb.from("products").insert(obj);
      if(r.error)throw r.error;
    }
    $("productDialog").close();page=0;await render();
  }catch(e){alert("儲存失敗："+(e.message||String(e)))}finally{$("saveProduct").disabled=false}
};

/* ==================== 離線編輯／同步層 ==================== */
const OFF_DB = "hardware_inventory_offline_v1";
const OFF_VERSION = 1;
const OFF_STORES = ["products","vendors","categories","locations","transactions","documents","queue","files","meta"];
let offlineDB=null;
let offlineReady=false;
let syncing=false;
let syncErrorCount=0;
const OFFLINE_USER_KEY = "hardware_inventory_offline_user_v2";

function saveOfflineUser(user){
  if(!user?.id)return;
  try{localStorage.setItem(OFFLINE_USER_KEY,JSON.stringify({id:user.id,email:user.email||""}))}catch(_){}
}
function getOfflineUser(){
  try{const x=JSON.parse(localStorage.getItem(OFFLINE_USER_KEY)||"null");return x?.id?x:null}catch(_){return null}
}
function clearOfflineUser(){try{localStorage.removeItem(OFFLINE_USER_KEY)}catch(_) {}}
function getSupabaseStoredUser(){
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i)||"";
      if(!k.includes('-auth-token')) continue;
      const raw=localStorage.getItem(k);
      if(!raw) continue;
      const obj=JSON.parse(raw);
      const u=obj?.user || obj?.currentSession?.user || obj?.session?.user;
      if(u?.id) return {id:u.id,email:u.email||""};
    }
  }catch(_){}
  return null;
}

function openOfflineDB(){
  return new Promise((resolve,reject)=>{
    if(offlineDB){resolve(offlineDB);return;}
    const req=indexedDB.open(OFF_DB,OFF_VERSION);
    req.onupgradeneeded=()=>{
      const db=req.result;
      for(const store of OFF_STORES){
        if(!db.objectStoreNames.contains(store)){
          if(store==="queue"||store==="files"||store==="meta") db.createObjectStore(store,{keyPath:"id"});
          else db.createObjectStore(store,{keyPath:"id"});
        }
      }
      if(!db.objectStoreNames.contains("queue")) db.createObjectStore("queue",{keyPath:"id"});
    };
    req.onsuccess=()=>{offlineDB=req.result;offlineReady=true;resolve(offlineDB)};
    req.onerror=()=>reject(req.error||new Error("離線資料庫無法啟動"));
  });
}
function idbStore(name,mode="readonly"){return offlineDB.transaction(name,mode).objectStore(name)}
function idbGetAll(name){return new Promise((resolve,reject)=>{const r=idbStore(name).getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error)})}
function idbGet(name,id){return new Promise((resolve,reject)=>{const r=idbStore(name).get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function idbPut(name,value){return new Promise((resolve,reject)=>{const r=idbStore(name,"readwrite").put(value);r.onsuccess=()=>resolve(value);r.onerror=()=>reject(r.error)})}
function idbDelete(name,id){return new Promise((resolve,reject)=>{const r=idbStore(name,"readwrite").delete(id);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
function idbClear(name){return new Promise((resolve,reject)=>{const r=idbStore(name,"readwrite").clear();r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
async function cacheRows(store,rows){for(const row of (rows||[])) await idbPut(store,row)}
async function setMeta(key,value){await idbPut("meta",{id:key,value})}
async function getMeta(key){const x=await idbGet("meta",key);return x?.value}

async function getQueue(){return (await idbGetAll("queue")).sort((a,b)=>(a.created_at||0)-(b.created_at||0))}
async function queueCount(){return (await getQueue()).length}
async function updateOfflineUI(){
  const online=navigator.onLine;
  const count=await queueCount().catch(()=>0);
  const n=$("networkStatus"), s=$("syncStatus"), note=$("offlineNote");
  if(n){n.className="network-pill"+(online?"":" offline");n.textContent=online?"🟢 線上":"🔴 離線"}
  if(s){s.className="network-pill"+(count?" pending":" hidden");s.textContent=count?`待同步 ${count} 筆`:""}
  if(note){
    if(!online){note.classList.remove("hidden");note.textContent=count?`目前是離線模式。你仍可新增／編輯商品、入庫、出庫；共有 ${count} 筆修改等候連線後同步。AI 智慧搜尋需要網路。`:`目前是離線模式。你仍可新增／編輯商品、入庫、出庫；連線恢復後會自動同步。AI 智慧搜尋需要網路。`;}
    else if(count){note.classList.remove("hidden");note.textContent=`已恢復網路，正在等待同步 ${count} 筆離線修改。你也可以按「☁️ 同步」。`}
    else note.classList.add("hidden");
  }
}

async function enqueue(type,payload,fileBlob=null){
  const id=crypto.randomUUID();
  let fileKey=null;
  if(fileBlob){
    fileKey=crypto.randomUUID();
    await idbPut("files",{id:fileKey,blob:fileBlob,name:fileBlob.name||"image.jpg",type:fileBlob.type||"image/jpeg"});
  }
  await idbPut("queue",{id,type,payload,fileKey,created_at:Date.now(),user_id:session?.user?.id||null});
  await updateOfflineUI();
  return id;
}

async function cacheProduct(p){if(p?.id)await idbPut("products",p)}
async function cacheVendor(v){if(v?.id)await idbPut("vendors",v)}
async function cacheTransaction(t){if(t?.id)await idbPut("transactions",t)}
async function cacheDocument(d){if(d?.id)await idbPut("documents",d)}

function localMatches(p,q){
  if(!q)return true;
  const vendor=vendorCache.find(v=>v.id===p.vendor_id)?.name||"";
  const hay=[p.sku,p.name,p.spec,p.category,p.location,p.barcode,p.parent_category,p.child_category,p.note,vendor].filter(Boolean).join(" ").toLowerCase();
  return hay.includes(q.toLowerCase());
}
function applyLocalFilters(items){
  return items.filter(p=>{
    if(productFilters.vendor && p.vendor_id!==productFilters.vendor)return false;
    if(productFilters.parent && !String(p.parent_category||"").toLowerCase().includes(productFilters.parent.toLowerCase()))return false;
    if(productFilters.child && !String(p.child_category||"").toLowerCase().includes(productFilters.child.toLowerCase()))return false;
    const stock=Number(p.stock||0),min=Number(p.min_stock||0);
    if(productFilters.stock==="out" && stock!==0)return false;
    if(productFilters.stock==="low" && !(stock<=min))return false;
    if(productFilters.stock==="normal" && !(stock>0))return false;
    return true;
  });
}

async function loadLocalMeta(){
  vendorCache=await idbGetAll("vendors");
  categoryCache=await idbGetAll("categories");
  locationCache=await idbGetAll("locations");
  vendorCache.sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"zh-TW"));
  categoryCache.sort((a,b)=>(Number(a.sort_order||0)-Number(b.sort_order||0))||String(a.name||"").localeCompare(String(b.name||""),"zh-TW"));
  locationCache.sort((a,b)=>(Number(a.sort_order||0)-Number(b.sort_order||0))||String(a.name||"").localeCompare(String(b.name||""),"zh-TW"));
}

async function loadMeta(){
  if(!navigator.onLine){await loadLocalMeta();return}
  try{
    const [v,c,l]=await Promise.all([
      sb.from("vendors").select("id,name,phone,address,contact_name,note,user_id").order("name").limit(1000),
      sb.from("categories").select("id,name,parent_id,sort_order,note,user_id").order("sort_order").order("name").limit(1000),
      sb.from("locations").select("id,name,parent_id,sort_order,note,user_id").order("sort_order").order("name").limit(1000)
    ]);
    if(v.error)throw new Error("讀取廠商資料失敗："+v.error.message);
    if(c.error)throw new Error("讀取分類資料失敗："+c.error.message);
    if(l.error)throw new Error("讀取位置資料失敗："+l.error.message);
    vendorCache=v.data||[];categoryCache=c.data||[];locationCache=l.data||[];
    await cacheRows("vendors",vendorCache);await cacheRows("categories",categoryCache);await cacheRows("locations",locationCache);
    await setMeta("last_meta_sync",Date.now());
  }catch(e){
    await loadLocalMeta();
    if(!vendorCache.length&&!categoryCache.length&&!locationCache.length)throw e;
  }
}

async function loadStats(){
  if(navigator.onLine){
    const pc=await sb.from("products").select("id",{count:"exact",head:true});
    if(pc.error)throw new Error("讀取商品資料失敗："+pc.error.message);
    const vc=await sb.from("vendors").select("id",{count:"exact",head:true});
    if(vc.error)throw new Error("讀取廠商資料失敗："+vc.error.message);
    const local=await idbGetAll("products").catch(()=>[]);
    const qty=local.reduce((a,p)=>a+Number(p.stock||0),0);
    const lowCount=local.filter(p=>Number(p.stock||0)<=Number(p.min_stock||0)).length;
    $("statProducts").textContent=fmt(pc.count||local.length||0);
    $("statVendors").textContent=fmt(vc.count||vendorCache.length||0);
    $("statQty").textContent=local.length?fmt(qty):"—";
    $("statLow").textContent=local.length?fmt(lowCount):"—";
  }else{
    const local=await idbGetAll("products");
    const qty=local.reduce((a,p)=>a+Number(p.stock||0),0);
    const lowCount=local.filter(p=>Number(p.stock||0)<=Number(p.min_stock||0)).length;
    $("statProducts").textContent=fmt(local.length);$("statVendors").textContent=fmt(vendorCache.length);$("statQty").textContent=fmt(qty);$("statLow").textContent=fmt(lowCount);
  }
}

async function loadProducts(){
  if(!navigator.onLine){
    await loadLocalMeta();
    const all=await idbGetAll("products");
    const q=$("search").value.trim();
    let items=all.filter(p=>localMatches(p,q));
    items=applyLocalFilters(items).sort((a,b)=>String(a.name||"").localeCompare(String(b.name||""),"zh-TW"));
    totalCount=items.length;const from=page*PAGE_SIZE;productCache=items.slice(from,from+PAGE_SIZE);
    renderProducts(productCache.map(p=>({...p,_photo:""})));
    if($("smartSummary")){$("smartSummary").classList.remove("hidden");$("smartSummary").textContent="🔴 離線搜尋：使用最後一次同步的資料";}
    return;
  }
  if(searchMode==="smart"&&smartQuery){return runSmartSearch(smartQuery,{keepMode:true})}
  const q=$("search").value.trim();
  let query=sb.from("products").select("id,sku,name,spec,category,location,stock,min_stock,cost,price,photo_url,created_at,updated_at,user_id,vendor_id,category_id,location_id,barcode,unit,record_date,photo_path,note,parent_category,child_category",{count:"exact"});
  if(q){const safe=q.replace(/[(),]/g," ");query=query.or(`sku.ilike.%${safe}%,name.ilike.%${safe}%,spec.ilike.%${safe}%,category.ilike.%${safe}%,location.ilike.%${safe}%,barcode.ilike.%${safe}%,parent_category.ilike.%${safe}%,child_category.ilike.%${safe}%,note.ilike.%${safe}%`)}
  if(productFilters.vendor)query=query.eq("vendor_id",productFilters.vendor);
  if(productFilters.parent)query=query.ilike("parent_category",`%${productFilters.parent}%`);
  if(productFilters.child)query=query.ilike("child_category",`%${productFilters.child}%`);
  if(productFilters.stock==="out")query=query.eq("stock",0);
  if(productFilters.stock==="low")query=query.lte("stock",productFilters._minHack??0);
  if(productFilters.stock==="normal")query=query.gt("stock",0);
  const from=page*PAGE_SIZE,to=from+PAGE_SIZE-1;
  const {data,error,count}=await query.order("name").range(from,to);
  if(error)throw new Error("讀取商品清單失敗："+error.message);
  totalCount=count||0;productCache=data||[];await cacheRows("products",productCache);
  const rows=await Promise.all(productCache.map(async p=>({...p,_photo:await signedPhoto(p.photo_path)})));
  renderProducts(rows);
}

async function saveProductOfflineOrOnline(){
  const user=session?.user || getOfflineUser();if(!user?.id)return alert("尚未登入，請先在線登入一次。");
  const name=$("name").value.trim();if(!name)return alert("請輸入商品名稱");$("saveProduct").disabled=true;

    const isNew=!editingId;const id=editingId||crypto.randomUUID();
    let current=isNew?{id,user_id:user.id,stock:Math.max(0,Number($("qty").value||0)),created_at:new Date().toISOString()}:await idbGet("products",id);
    current=current||{id,user_id:user.id,stock:0,created_at:new Date().toISOString()};

    const file=$("photo").files[0]||pendingPhoto;

      $("productDialog").close();page=0;await render();alert("已儲存在本機。恢復網路後會自動同步雲端。");return;

    if(file){photoPath=await uploadPhoto(file,id);obj.photo_path=photoPath}
    if(isNew){const r=await sb.from("products").insert(obj);if(r.error)throw r.error}else{const r=await sb.from("products").update({...obj,updated_at:new Date().toISOString()}).eq("id",id);if(r.error)throw r.error}

    await cacheProduct(obj);$("productDialog").close();page=0;await render();
  }catch(e){alert("儲存失敗："+(e.message||String(e)))}finally{$("saveProduct").disabled=false}
}

async function saveMovementOfflineOrOnline(){
  const qty=Number($("movementQty").value);if(!Number.isFinite(qty)||qty<=0)return alert("請輸入正確數量");
  const reason=$("movementReason").value.trim()||null;$("saveMovement").disabled=true;
  try{
    const p=await idbGet("products",movementId)||productCache.find(x=>x.id===movementId);
    const currentStock=Number(p?.stock||0);if(movementType==="出庫"&&qty>currentStock)return alert("出庫數量不可超過目前庫存");
    if(!navigator.onLine){
      const before=currentStock,delta=movementType==="入庫"?qty:-qty,after=before+delta;
      const updated={...p,stock:after,updated_at:new Date().toISOString(),record_date:today};
      await cacheProduct(updated);
      const tx={id:crypto.randomUUID(),user_id:session.user.id,product_id:movementId,type:movementType,quantity:qty,delta,before_stock:before,after_stock:after,reason,created_at:new Date().toISOString(),_local:true};
      await cacheTransaction(tx);await enqueue("movement",{product_id:movementId,type:movementType,quantity:qty,reason});
      $("movementDialog").close();page=0;await render();alert("庫存異動已儲存在本機。恢復網路後會同步雲端。");return;
    }
    const {data,error}=await sb.rpc("change_stock",{p_product_id:movementId,p_type:movementType,p_quantity:qty,p_reason:reason});if(error)throw error;await cacheProduct(data);
    $("movementDialog").close();page=0;await render();
  }catch(e){alert("庫存異動失敗："+(e.message||String(e)))}finally{$("saveMovement").disabled=false}
}
$("saveMovement").onclick=saveMovementOfflineOrOnline;

async function removeProductOfflineOrOnline(id){
  if(!confirm("確定刪除這個商品？"))return;
  const p=await idbGet("products",id)||productCache.find(x=>x.id===id);
  try{
    if(!navigator.onLine){await idbDelete("products",id);await enqueue("product_delete",{id,photo_path:p?.photo_path||null});await render();alert("已在本機刪除。恢復網路後會同步刪除雲端資料。");return}
    if(p?.photo_path)await sb.storage.from(CONFIG.bucket).remove([p.photo_path]);const r=await sb.from("products").delete().eq("id",id);if(r.error)throw r.error;await idbDelete("products",id);await render();
  }catch(e){alert("刪除失敗："+(e.message||String(e)))}
}
removeProduct=removeProductOfflineOrOnline;

async function uploadPhoto(file,productId){
  if(!navigator.onLine)throw new Error("目前離線，照片會在儲存在本機並於恢復網路後同步。");
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";
  const path=`${session.user.id}/products/${productId}-${Date.now()}.${ext}`;
  const {error}=await sb.storage.from(CONFIG.bucket).upload(path,file,{contentType:file.type||"image/jpeg",upsert:false});if(error)throw error;return path;
}

async function showProductHistoryOfflineOrOnline(id){
  if(!navigator.onLine){const all=await idbGetAll("transactions");const rows=all.filter(t=>t.product_id===id).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,50);return alert(rows.map(t=>`${new Date(t.created_at).toLocaleString("zh-TW")}｜${t.type}｜${t.delta>0?"+":""}${t.delta}｜${t.before_stock} → ${t.after_stock}｜${t.reason||""}${t._local?"｜待同步":""}`).join("\\n")||"目前沒有異動紀錄")}
  const r=await sb.from("inventory_transactions").select("created_at,type,delta,before_stock,after_stock,reason").eq("product_id",id).order("created_at",{ascending:false}).limit(50);if(r.error)return alert("讀取紀錄失敗："+r.error.message);for(const t of (r.data||[]))await cacheTransaction({...t,id:crypto.randomUUID(),product_id:id});alert((r.data||[]).map(t=>`${new Date(t.created_at).toLocaleString("zh-TW")}｜${t.type}｜${t.delta>0?"+":""}${t.delta}｜${t.before_stock} → ${t.after_stock}｜${t.reason||""}`).join("\\n")||"目前沒有異動紀錄")
}
showProductHistory=showProductHistoryOfflineOrOnline;

async function renderTransactions(){
  let data=[];
  if(navigator.onLine){
    const r=await sb.from("inventory_transactions").select("id,product_id,type,quantity,delta,before_stock,after_stock,reason,created_at").order("created_at",{ascending:false}).limit(300);
    if(r.error)throw new Error("讀取異動紀錄失敗："+r.error.message);data=r.data||[];for(const t of data)await cacheTransaction(t);
  }else data=(await idbGetAll("transactions")).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at))).slice(0,300);
  const localProducts=await idbGetAll("products");
  const findName=id=>localProducts.find(p=>p.id===id)?.name||productCache.find(p=>p.id===id)?.name||"商品";
  $("app").innerHTML=`<div class="card section"><h3>📋 最近 ${navigator.onLine?"300":"300（含離線待同步）"} 筆異動</h3><div class="table-wrap"><table class="table"><thead><tr><th>時間</th><th>商品</th><th>類型</th><th>數量</th><th>異動前</th><th>異動後</th><th>原因</th></tr></thead><tbody>${(data||[]).map(t=>`<tr><td>${esc(new Date(t.created_at).toLocaleString("zh-TW"))}</td><td>${esc(findName(t.product_id))}</td><td>${esc(t.type)}${t._local?" <span class=\"badge low\">待同步</span>":""}</td><td class="num">${t.delta>0?"+":""}${fmt(t.delta)}</td><td class="num">${fmt(t.before_stock)}</td><td class="num">${fmt(t.after_stock)}</td><td>${esc(t.reason||"")}</td></tr>`).join("")||`<tr><td colspan="7" style="text-align:center;padding:30px">尚無異動紀錄</td></tr>`}</tbody></table></div></div>`;
}

async function renderDocuments(){
  let docs=[];
  if(navigator.onLine){const r=await sb.from("purchase_documents").select("id,vendor_id,document_number,document_date,image_path,status,ai_summary,created_at,updated_at").order("created_at",{ascending:false}).limit(100);if(r.error)throw new Error("讀取貨單失敗："+r.error.message);docs=r.data||[];for(const d of docs)await cacheDocument(d)}else docs=(await idbGetAll("documents")).sort((a,b)=>String(b.created_at).localeCompare(String(a.created_at)));
  const vName=id=>vendorCache.find(v=>v.id===id)?.name||"未設定廠商";
  $("app").innerHTML=`<div class="addbar"><div class="hint">貨單照片可以先離線保存，連線後再同步</div><button class="primary" onclick="$(\"documentDialog\").showModal()">＋ 新增貨單</button></div><div class="list">${docs.map(d=>`<div class="card section"><div class="row"><div><strong>📷 ${esc(d.document_number||"未命名貨單")}</strong><div class="meta">${esc(d.document_date||"")}　🏭 ${esc(vName(d.vendor_id))}<br>狀態：${esc(d.status||"待辨識")}${d._local?"　（待同步）":""}</div></div></div>${d.ai_summary?`<div class="notice" style="margin-top:10px">${esc(d.ai_summary)}</div>`:""}</div>`).join("")||`<div class="card empty">尚無貨單</div>`}</div>`;
}

async function createDocumentOfflineOrOnline(){
  const f=$("documentPhoto").files[0];if(!f)return alert("請先選擇貨單照片");
  const id=crypto.randomUUID();const ext=(f.name.split(".").pop()||"jpg").toLowerCase().replace(/[^a-z0-9]/g,"")||"jpg";const path=`${session.user.id}/documents/${id}.${ext}`;
  const base={id,user_id:session.user.id,status:"待辨識",document_date:today,image_path:path,created_at:new Date().toISOString(),updated_at:new Date().toISOString()};
  try{
    if(!navigator.onLine){await cacheDocument({...base,_local:true});await enqueue("document_create",base,f);$("documentDialog").close();await render();alert("貨單已儲存在本機。恢復網路後會同步雲端；AI 辨識仍需網路。");return}
    const up=await sb.storage.from(CONFIG.bucket).upload(path,f,{contentType:f.type||"image/jpeg"});if(up.error)throw up.error;const ins=await sb.from("purchase_documents").insert(base);if(ins.error)throw ins.error;await cacheDocument(base);$("documentDialog").close();await render();alert("貨單已儲存。AI 辨識功能會在後端完成。");
  }catch(e){alert("建立貨單失敗："+(e.message||String(e)))}
}
$("createDocument").onclick=createDocumentOfflineOrOnline;

async function syncOne(item){
  const fileRec=item.fileKey?await idbGet("files",item.fileKey):null;
  const user=session?.user?.id;if(!user)throw new Error("尚未登入");
  if(item.type==="product_create"){
    const obj={...item.payload,user_id:user};
    if(fileRec?.blob)obj.photo_path=await uploadPhoto(fileRec.blob,obj.id);
    const r=await sb.from("products").upsert(obj,{onConflict:"id"});if(r.error)throw r.error;await cacheProduct(obj);
  }else if(item.type==="product_update"){
    const obj={...item.payload,user_id:user};const old=await idbGet("products",obj.id);
    if(fileRec?.blob)obj.photo_path=await uploadPhoto(fileRec.blob,obj.id);
    const r=await sb.from("products").update({...obj,updated_at:new Date().toISOString()}).eq("id",obj.id);if(r.error)throw r.error;await cacheProduct(obj);if(fileRec?.blob&&old?.photo_path&&old.photo_path!==obj.photo_path)await sb.storage.from(CONFIG.bucket).remove([old.photo_path]).catch(()=>{});
  }else if(item.type==="vendor_create"){
    const r=await sb.from("vendors").upsert({...item.payload,user_id:user},{onConflict:"id"});if(r.error)throw r.error;await cacheVendor(item.payload);
  }else if(item.type==="movement"){
    const p=item.payload;const r=await sb.rpc("change_stock",{p_product_id:p.product_id,p_type:p.type,p_quantity:p.quantity,p_reason:p.reason});if(r.error)throw r.error;await cacheProduct(r.data);
    const oldLocal=await idbGetAll("transactions");for(const t of oldLocal.filter(t=>t._local&&t.product_id===p.product_id&&t.type===p.type&&Number(t.quantity)===Number(p.quantity)).slice(-1))await idbDelete("transactions",t.id);
  }else if(item.type==="product_delete"){
    const r=await sb.from("products").delete().eq("id",item.payload.id);if(r.error)throw r.error;if(item.payload.photo_path)await sb.storage.from(CONFIG.bucket).remove([item.payload.photo_path]).catch(()=>{});await idbDelete("products",item.payload.id);
  }else if(item.type==="document_create"){
    if(fileRec?.blob){const up=await sb.storage.from(CONFIG.bucket).upload(item.payload.image_path,fileRec.blob,{contentType:fileRec.blob.type||"image/jpeg"});if(up.error)throw up.error}
    const r=await sb.from("purchase_documents").upsert(item.payload,{onConflict:"id"});if(r.error)throw r.error;await cacheDocument(item.payload);
  }
  await idbDelete("queue",item.id);if(item.fileKey)await idbDelete("files",item.fileKey);
}

async function syncOfflineChanges(){
  if(syncing||!navigator.onLine||!session)return;
  syncing=true;syncErrorCount=0;await updateOfflineUI();
  try{
    const q=await getQueue();
    for(const item of q){
      if(!navigator.onLine)break;
      try{await syncOne(item)}catch(e){syncErrorCount++;console.error("離線同步失敗",item,e);break}
      await updateOfflineUI();
    }
    await refreshAllCachesAfterSync();
  }finally{syncing=false;await updateOfflineUI();if(syncErrorCount){alert("有部分離線修改尚未同步成功。請確認網路後再按「☁️ 同步」。")}}
}

async function refreshAllCachesAfterSync(){
  if(!navigator.onLine||!session)return;
  try{
    await loadMeta();
    // 只重新抓目前商品頁，避免每次同步都下載全部商品。
    if(currentTab==="products")await loadProducts();
    else await render();
  }catch(e){console.warn("同步後刷新失敗",e)}
}

async function downloadOfflineData(){
  if(!navigator.onLine)return alert("目前離線，請先恢復網路再下載離線資料。");
  const btn=$("downloadOfflineBtn");if(btn)btn.disabled=true;
  const old=$("offlineNote");
  try{
    if(old){old.classList.remove("hidden");old.textContent="正在下載離線商品資料，商品很多時可能需要一點時間…"}
    await loadMeta();let offset=0,batch=500,total=0;
    while(true){
      const r=await sb.from("products").select("id,sku,name,spec,category,location,stock,min_stock,cost,price,photo_url,created_at,updated_at,user_id,vendor_id,category_id,location_id,barcode,unit,record_date,photo_path,note,parent_category,child_category").range(offset,offset+batch-1).order("name");
      if(r.error)throw r.error;const rows=r.data||[];if(!rows.length)break;await cacheRows("products",rows);total+=rows.length;if(old)old.textContent=`正在下載離線資料… 已保存 ${fmt(total)} 筆商品`;if(rows.length<batch)break;offset+=batch;
    }
    const tx=await sb.from("inventory_transactions").select("id,product_id,type,quantity,delta,before_stock,after_stock,reason,created_at").order("created_at",{ascending:false}).limit(1000);if(!tx.error)await cacheRows("transactions",tx.data||[]);
    const docs=await sb.from("purchase_documents").select("id,vendor_id,document_number,document_date,image_path,status,ai_summary,created_at,updated_at").order("created_at",{ascending:false}).limit(100);if(!docs.error)await cacheRows("documents",docs.data||[]);
    await setMeta("last_full_sync",Date.now());await loadLocalMeta();await loadStats();
    if(old){old.classList.remove("hidden");old.textContent=`✅ 離線資料已下載完成，共 ${fmt(total)} 筆商品。下次沒有網路時也能搜尋與編輯。`}
    await render();
  }catch(e){if(old){old.classList.remove("hidden");old.textContent="下載離線資料失敗："+(e.message||String(e))}alert("下載離線資料失敗："+(e.message||String(e)))}
  finally{if(btn)btn.disabled=false;await updateOfflineUI()}
}

async function offlineBoot(){
  try{
    await openOfflineDB();
    if("serviceWorker" in navigator){navigator.serviceWorker.register("./sw.js",{updateViaCache:"none"}).catch(()=>{});}

    $("syncBtn").onclick=syncOfflineChanges;
    $("downloadOfflineBtn").onclick=downloadOfflineData;
    window.addEventListener("online",async()=>{
      await updateOfflineUI();
      try{
        if(sb){
          const {data}=await sb.auth.getSession();
          if(data?.session){session=data.session;saveOfflineUser(session.user);showApp();renderSearchTools();initSmartSearch();initVoiceSearch();}
        }
      }catch(_){}
      await syncOfflineChanges();
      await render(true);
    });
    window.addEventListener("offline",async()=>{
      await updateOfflineUI();
      await render(true).catch(()=>{});
    });
    await updateOfflineUI();

    if(!window.supabase){
      throw new Error("Supabase 元件載入失敗。請先在線開啟一次網站，讓網站完成離線快取。");
    }

    sb=window.supabase.createClient(CONFIG.url,CONFIG.key);

    // 離線時優先使用本機身分與 IndexedDB；不要求每次離線重新通過 Supabase 網路驗證。
    if(!navigator.onLine){
      const cachedProducts=await idbGetAll("products").catch(()=>[]);
      const cachedVendors=await idbGetAll("vendors").catch(()=>[]);
      const offlineUser=getOfflineUser() || getSupabaseStoredUser() ||
        ((cachedProducts[0]?.user_id||cachedVendors[0]?.user_id)?{id:cachedProducts[0]?.user_id||cachedVendors[0]?.user_id,email:""}:null);
      if(offlineUser?.id){
        saveOfflineUser(offlineUser);
        session={user:{id:offlineUser.id,email:offlineUser.email||""},_offline:true};
        showApp();renderSearchTools();initSmartSearch();initVoiceSearch();
        await loadLocalMeta();
        await render(true);
        setTimeout(()=>{
          if($("offlineNote")){
            $("offlineNote").classList.remove("hidden");
            $("offlineNote").textContent=cachedProducts.length
              ? `🔴 離線模式：目前使用本機資料（${fmt(cachedProducts.length)} 筆商品）。恢復網路後會自動同步，AI 智慧搜尋需要網路。`
              : "🔴 離線模式：目前還沒有下載商品資料。你可以新增商品；恢復網路後會自動同步。AI 智慧搜尋需要網路。";
          }
        },0);
      }else{
        showLogin();
        setLoginMessage("目前沒有網路。請先在線登入一次，讓這台裝置取得離線使用權限；之後即可離線編輯。");
      }

      // 不在離線模式註冊會清除本機身分的登出事件。
      setInterval(updateOfflineUI,5000);
      return;
    }

    let realSession=null;
    try{
      const result=await sb.auth.getSession();
      if(!result.error)realSession=result.data?.session||null;
    }catch(_){}

    if(realSession){
      session=realSession;
      saveOfflineUser(session.user);
      showApp();renderSearchTools();initSmartSearch();initVoiceSearch();
      await syncOfflineChanges();
      await render(true);
    }else{
      showLogin();
    }

    sb.auth.onAuthStateChange(async(_event,newSession)=>{
      session=newSession||null;
      if(session){
        saveOfflineUser(session.user);
        showApp();renderSearchTools();initSmartSearch();initVoiceSearch();
        if(navigator.onLine)await syncOfflineChanges();
        await render(true);
      }else if(navigator.onLine){
        clearOfflineUser();
        showLogin();
      }
    });

    setInterval(updateOfflineUI,5000);
  }catch(e){
    console.error(e);
    const cachedProducts=await idbGetAll("products").catch(()=>[]);
    const offlineUser=getOfflineUser() || getSupabaseStoredUser() ||
      (cachedProducts[0]?.user_id?{id:cachedProducts[0].user_id,email:""}:null);
    if(!navigator.onLine && offlineUser?.id){
      saveOfflineUser(offlineUser);
      session={user:{id:offlineUser.id,email:offlineUser.email||""},_offline:true};
      showApp();renderSearchTools();initSmartSearch();initVoiceSearch();
      await loadLocalMeta();
      await render(true);
    }else{
      showLogin();
      setLoginMessage("系統初始化失敗："+(e.message||String(e)));
    }
  }
}

async function render(first=false){
  try{
    if(!session)return;showApp();await updateOfflineUI();
    if(first)$("app").innerHTML=`<div class="card empty">${navigator.onLine?"正在連線雲端資料庫…":"正在讀取離線資料…"}</div>`;
    await loadMeta();await loadStats();
    if(currentTab==="products")await loadProducts();
    else if(currentTab==="vendors")await renderVendors();
    else if(currentTab==="categories")renderCategories();
    else if(currentTab==="locations")renderLocations();
    else if(currentTab==="transactions")await renderTransactions();
    else if(currentTab==="documents")await renderDocuments();
  }catch(e){console.error(e);if(!navigator.onLine){$("app").innerHTML=`<div class="card empty">目前沒有可用的離線資料。<br><br>請先在線登入一次，並按「⬇️ 下載離線資料」。</div>`}else setAppMessage("系統載入失敗："+(e.message||String(e)))}
}

offlineBoot();
</script>
